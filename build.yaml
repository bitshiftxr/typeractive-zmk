# Standard split: left half is central (with ZMK Studio over USB), no dongle.
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_epaper
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: nano_corne_left

  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_epaper
    artifact-name: nano_corne_right

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nano_reset_settings
